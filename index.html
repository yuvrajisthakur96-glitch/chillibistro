<!--
================================================================================
 CHILLI BISTRO — POS / BILLING  (single-file front end)
 Theme: Crystal Glassmorphism. Motion effects re-created in vanilla JS from
 React Bits patterns (Aurora, SpotlightCard, ShinyText, CountUp, GlareHover,
 ClickSpark, AnimatedList) so this file runs without a build step.

 BACKEND HAND-OFF NOTES
 ----------------------
 * All data access goes through the `API` object (search "DATA LAYER").
   - CONFIG.DATA_MODE = 'local'  → everything is stored in this browser (demo).
   - CONFIG.DATA_MODE = 'remote' → REST calls to CONFIG.API_BASE:
       GET    /api/{collection}            → array of docs
       POST   /api/{collection}            → create (body = doc, returns doc)
       PATCH  /api/{collection}/{id}       → partial update (returns doc)
       DELETE /api/{collection}/{id}
       PUT    /api/{collection}            → bulk replace (menu import)
       GET    /api/docs/{key}              → single JSON doc (settings, running)
       PUT    /api/docs/{key}
       POST   /api/auth/login              → { token, user:{name,email,role} }
       POST   /api/auth/owner-pin          → { ok:true|false }
   Collections: menu, orders, kots, tables, customers, expenses, staff, held
   Docs:        settings, running (open carts per table / takeaway / delivery)
 * Remote mode polls every CONFIG.POLL_MS for orders/kots/tables (swap for
   WebSockets/SSE if you prefer — see startSync()).
 * Inventory / recipes / purchases / suppliers have been removed on purpose.
 * Menu: Menu → "Import Menu" accepts CSV or JSON (format shown in the dialog).
================================================================================
-->

  --side:248px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.display{font-family:Outfit,Inter,sans-serif;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::selection{background:rgba(240,40,63,.18)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(120,130,180,.28);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Aurora + crystal background (React Bits: Aurora) ---------- */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:radial-gradient(1200px 800px at 10% -10%,#ffe3e6 0%,transparent 60%),radial-gradient(900px 700px at 110% 10%,#dcecff 0%,transparent 60%),radial-gradient(1000px 900px at 50% 120%,#efe6ff 0%,transparent 60%),var(--bg)}
.aurora i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;mix-blend-mode:multiply;animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-8vw;top:-12vw;background:#ff9aa6;animation-duration:28s}
.aurora i:nth-child(2){width:40vw;height:40vw;right:-10vw;top:10vh;background:#a8d4ff;animation-duration:32s;animation-delay:-6s}
.aurora i:nth-child(3){width:38vw;height:38vw;left:30vw;bottom:-18vw;background:#c9b6ff;animation-duration:36s;animation-delay:-12s}
.aurora i:nth-child(4){width:26vw;height:26vw;left:55vw;top:-6vw;background:#ffd59a;animation-duration:30s;animation-delay:-3s}
.aurora i:nth-child(5){width:24vw;height:24vw;left:8vw;bottom:-6vw;background:#9ff0d8;animation-duration:34s;animation-delay:-9s}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vw,4vh,0) scale(1.12)}100%{transform:translate3d(-4vw,8vh,0) scale(.95)}}
.facets{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:linear-gradient(115deg,transparent 0 46%,rgba(255,255,255,.55) 46.2%,transparent 47% 100%),linear-gradient(62deg,transparent 0 70%,rgba(255,255,255,.45) 70.2%,transparent 71% 100%),linear-gradient(160deg,transparent 0 22%,rgba(255,255,255,.35) 22.2%,transparent 23% 100%)}
@media (prefers-reduced-motion:reduce){.aurora i{animation:none}}
body.no-motion .aurora i{animation:none}

/* ---------- Crystal glass primitives ---------- */
.glass{position:relative;background:linear-gradient(150deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border-radius:var(--r);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.25)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,1) 0%,rgba(255,255,255,.2) 35%,rgba(150,195,255,.55) 65%,rgba(255,160,185,.7) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
/* SpotlightCard */
.spot::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.65),rgba(255,210,220,.18) 35%,transparent 60%)}
.spot:hover::after{opacity:1}
.card{padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{font-size:16px;font-weight:700}
.card-h .sub{color:var(--muted);font-size:12px}

/* ShinyText */
.shiny{background:linear-gradient(110deg,#f0283f 0%,#ff5a3c 35%,#ffb08a 50%,#ff5a3c 65%,#f0283f 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4.5s linear infinite}
@keyframes shine{0%{background-position:120% 0}100%{background-position:-120% 0}}
body.no-motion .shiny{animation:none}

/* ---------- Layout ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--side) 1fr;height:100vh;gap:16px;padding:16px}
.sidebar{display:flex;flex-direction:column;padding:18px 12px;overflow:hidden}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.logo{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;background:#c8141f;box-shadow:0 6px 18px rgba(240,40,63,.3),0 0 0 2px rgba(255,255,255,.9)}
.logo img{width:100%;height:100%;object-fit:cover;transform:scale(1.2);display:block}
.brand b{display:block;font-family:Outfit;font-size:19px;font-weight:800;letter-spacing:.02em;line-height:1.05}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.nav{flex:1;overflow:auto;padding:2px 2px 10px;margin:0 -2px}
.nav .grp{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 12px 6px}
.nav button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;color:var(--ink-2);font-weight:600;font-size:13.5px;transition:background .2s,color .2s,transform .15s;position:relative}
.nav button i.ic{width:20px;text-align:center;font-size:15px;opacity:.85}
.nav button .lock{margin-left:auto;font-size:10px;opacity:.45}
.nav button:hover{background:rgba(255,255,255,.55);color:var(--ink)}
.nav button.active{color:#fff;background:var(--grad);box-shadow:0 8px 22px rgba(240,40,63,.32),inset 0 1px 0 rgba(255,255,255,.45)}
.nav button.active .lock{opacity:.8}
.side-foot{border-top:1px solid var(--line);padding:12px 8px 0;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-family:Outfit;flex:none}
.side-foot .who{flex:1;min-width:0}
.side-foot .who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who small{color:var(--muted);font-size:11px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 20px;margin-bottom:16px}
.topbar h1{font-size:22px;font-weight:800}
.topbar .sub{color:var(--muted);font-size:12.5px}
.topbar .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid var(--edge);font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(15,159,116,.18)}
.chip.err .dot{background:var(--bad);box-shadow:0 0 0 3px rgba(225,29,72,.18)}
.btn.menu-toggle{display:none}
#pages{flex:1;overflow:auto;padding:2px 4px 30px;min-height:0}
.page-enter{animation:pageIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border-radius:13px;font-weight:600;font-size:13px;background:rgba(255,255,255,.7);border:1px solid var(--edge);box-shadow:0 2px 8px rgba(46,56,120,.06),inset 0 1px 0 #fff;transition:transform .12s,box-shadow .2s,background .2s;white-space:nowrap;color:var(--ink)}
.btn:hover{background:#fff;box-shadow:0 6px 18px rgba(46,56,120,.12),inset 0 1px 0 #fff}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);color:#fff;border-color:rgba(255,255,255,.5);box-shadow:0 8px 22px rgba(240,40,63,.3),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.primary:hover{filter:brightness(1.05);box-shadow:0 10px 28px rgba(240,40,63,.4),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.dark{background:linear-gradient(135deg,#232849,#3a4170);color:#fff;border-color:rgba(255,255,255,.2)}
.btn.good{background:linear-gradient(135deg,#0f9f74,#22c58f);color:#fff;border-color:rgba(255,255,255,.4)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.6)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn.lg{padding:14px 18px;font-size:15px;border-radius:16px}
.btn.icon{padding:8px;width:34px;height:34px}
.btn:disabled{opacity:.5;pointer-events:none}
.input,.select,textarea{width:100%;padding:10px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.6);box-shadow:inset 0 1px 3px rgba(46,56,120,.08);outline:none;transition:border .2s,box-shadow .2s,background .2s}
.input:focus,.select:focus,textarea:focus{border-color:rgba(240,40,63,.45);background:rgba(255,255,255,.85);box-shadow:0 0 0 4px rgba(240,40,63,.12)}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formgrid .full{grid-column:1/-1}
.seg{display:inline-flex;padding:4px;border-radius:14px;background:rgba(255,255,255,.5);border:1px solid var(--edge);gap:2px}
.seg button{padding:8px 13px;border-radius:10px;font-weight:600;font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:#fff;color:var(--chilli);box-shadow:0 3px 10px rgba(46,56,120,.12)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(120,130,180,.14);color:var(--ink-2);white-space:nowrap}
.badge.good{background:rgba(15,159,116,.14);color:var(--good)}
.badge.warn{background:rgba(217,119,6,.14);color:var(--warn)}
.badge.bad{background:rgba(225,29,72,.12);color:var(--bad)}
.badge.info{background:rgba(37,99,235,.12);color:var(--info)}
.badge.hot{background:var(--grad);color:#fff}
.vd{width:13px;height:13px;border:1.6px solid var(--veg);border-radius:3px;display:inline-grid;place-items:center;flex:none;background:#fff}
.vd::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--veg)}
.vd.nonveg{border-color:var(--nonveg)}.vd.nonveg::after{background:var(--nonveg);border-radius:0;width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-bottom:6px solid var(--nonveg);background:none}
.vd.egg{border-color:var(--egg)}.vd.egg::after{background:var(--egg)}

/* ---------- Grids, KPI, tables ---------- */
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{padding:18px 18px 16px;overflow:hidden}
.kpi .k-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:17px;color:#fff;margin-bottom:14px;box-shadow:0 8px 18px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.5)}
.kpi .k-l{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .k-v{font-family:Outfit;font-size:28px;font-weight:800;margin:2px 0 4px;letter-spacing:-.02em}
.kpi .k-s{font-size:12px;color:var(--muted)}
.kpi .k-s .up{color:var(--good);font-weight:700}.kpi .k-s .down{color:var(--bad);font-weight:700}
.kpi .orb{position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;opacity:.22;filter:blur(6px)}
.c1{background:var(--grad)}.c2{background:linear-gradient(135deg,#4aa8ff,#7c5cff)}.c3{background:linear-gradient(135deg,#10b98a,#4ade80)}.c4{background:linear-gradient(135deg,#f59e0b,#fbbf24)}.c5{background:linear-gradient(135deg,#7c5cff,#c084fc)}
.table-wrap{overflow:auto;border-radius:var(--r-sm)}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.data th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(246,248,253,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:1}
table.data td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data tr:hover td{background:rgba(255,255,255,.45)}
table.data td.num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty i{font-size:34px;margin-bottom:10px;display:block;opacity:.45}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--line)}
.list-row:last-child{border-bottom:0}
.rank{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:12px;background:rgba(240,40,63,.1);color:var(--chilli);flex:none}
.bar{height:6px;border-radius:9px;background:rgba(120,130,180,.15);overflow:hidden}
.bar span{display:block;height:100%;background:var(--grad);border-radius:9px}
.chart-box{position:relative;height:260px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .input,.toolbar .select{width:auto;min-width:180px}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-sm);background:linear-gradient(135deg,rgba(255,159,67,.16),rgba(240,40,63,.08));border:1px solid rgba(255,255,255,.8);margin-bottom:14px;font-size:13px}
.notice i{color:var(--chilli);margin-top:2px}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:1fr 390px;gap:16px;height:100%;min-height:0}
.pos-left{display:flex;flex-direction:column;min-height:0;min-width:0}
.pos-bar{padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{position:relative;flex:1;min-width:200px}
.search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:40px;height:44px;font-size:15px}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
kbd{font-family:Inter;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.8);border:1px solid var(--line);color:var(--muted)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin}
.cat{flex:none;padding:9px 15px;border-radius:999px;font-weight:600;font-size:13px;background:rgba(255,255,255,.55);border:1px solid var(--edge);color:var(--ink-2);transition:all .2s}
.cat:hover{background:#fff}
.cat.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(240,40,63,.3)}
.cat .n{opacity:.65;font-size:11px;margin-left:4px}
.products{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;align-content:start;padding:2px 2px 20px}
.prod{padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:138px;overflow:hidden;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s;border-radius:18px}
.prod:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(46,56,120,.16),inset 0 1px 0 #fff}
.prod:active{transform:scale(.97)}
.prod .em{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(255,255,255,.5));box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(46,56,120,.08)}
.prod .nm{font-weight:650;font-size:13.5px;line-height:1.25;flex:1}
.prod .pr{display:flex;align-items:center;justify-content:space-between;font-family:Outfit;font-weight:800;font-size:16px}
.prod .qbadge{position:absolute;top:10px;right:10px;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--grad);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;box-shadow:0 4px 10px rgba(240,40,63,.35);z-index:2}
.prod.off{opacity:.45;pointer-events:none}
/* One card per dish with its sizes / portions (Small · Medium · Large, Half · Full …) */
.prod.pgroup{cursor:default}
.prod.pgroup:active{transform:none}
.prod.pgroup.wide{grid-column:span 2}
.prod .nmrow{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;flex:1}
.prod .pvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px;padding-top:6px}
.prod .pv{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;padding:6px 4px;border-radius:12px;border:1px solid rgba(240,40,63,.25);background:rgba(255,255,255,.75);color:inherit;font:inherit;cursor:pointer;transition:transform .12s ease,background .12s ease,border-color .12s ease}
.prod .pv:hover{border-color:var(--chilli);background:#fff}
.prod .pv:active{transform:scale(.95)}
.prod .pv .pvl{font-size:11px;font-weight:700;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.prod .pv b{font-family:Outfit;font-weight:800;font-size:14px;white-space:nowrap}
.prod .pv.off{opacity:.4;pointer-events:none}
.prod .pv .qbadge{top:-7px;right:-5px;min-width:20px;height:20px;padding:0 5px;font-size:11px}
/* GlareHover */
.glare{overflow:hidden}
.glare .gl{position:absolute;inset:0;pointer-events:none;border-radius:inherit;overflow:hidden}
.glare .gl::before{content:"";position:absolute;top:-50%;left:-120%;width:60%;height:200%;transform:rotate(25deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transition:left .65s ease}
.glare:hover .gl::before{left:150%}
.cart{display:flex;flex-direction:column;min-height:0;padding:0;overflow:hidden}
.cart-top{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.cart-items{flex:1;overflow:auto;padding:8px 12px}
.cline{padding:11px 8px;border-bottom:1px dashed var(--line);animation:lineIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes lineIn{from{opacity:0;transform:translateX(14px) scale(.98)}to{opacity:1;transform:none}}
.cline .t{display:flex;gap:8px;align-items:flex-start}
.cline .t b{flex:1;font-weight:650;font-size:13.5px}
.cline .m{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.qty{display:inline-flex;align-items:center;background:rgba(255,255,255,.75);border:1px solid var(--edge);border-radius:11px;overflow:hidden}
.qty button{width:30px;height:28px;font-weight:800;color:var(--chilli)}
.qty button:hover{background:rgba(240,40,63,.08)}
.qty span{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cline .note{font-size:11.5px;color:var(--warn);margin-top:4px}
.cline .sent{font-size:10.5px;font-weight:700;color:var(--good)}
.cline.is-comp{background:linear-gradient(90deg,rgba(15,159,116,.08),transparent);border-radius:12px}
.comp-tag{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.06em;background:rgba(15,159,116,.14);color:var(--good);vertical-align:middle}
.comp-btn{gap:5px}.comp-btn.on{background:var(--good);color:#fff;border-color:var(--good)}
.svc-switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.svc-switch input{display:none}
.svc-switch .sw{position:relative;width:32px;height:18px;border-radius:999px;background:rgba(120,130,180,.35);transition:background .25s;flex:none}
.svc-switch .sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s}
.svc-switch input:checked + .sw{background:var(--good)}
.svc-switch input:checked + .sw::after{transform:translateX(14px)}
.svc-row{padding:6px 8px;margin:2px -8px;border-radius:10px;background:rgba(120,130,180,.08);transition:background .25s}
.svc-row.on{background:rgba(15,159,116,.10)}
.svc-state{font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:999px;background:rgba(120,130,180,.2)}
.svc-row.on .svc-state{background:var(--good);color:#fff}
.tax-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}

.tax-tile .s{font-size:12px;margin-top:2px;opacity:.75}
@media (max-width:1024px){.tax-hero{grid-template-columns:repeat(2,1fr)}}
.cart-sum{padding:12px 16px 16px;border-top:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.55))}
.sumrow{display:flex;justify-content:space-between;padding:3px 0;font-size:13px;color:var(--ink-2)}
.sumrow.total{font-family:Outfit;font-size:24px;font-weight:800;color:var(--ink);padding-top:8px;margin-top:6px;border-top:1px dashed var(--line)}
.cart-actions{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin-top:12px}
.banner-add{padding:12px 14px;border-radius:14px;margin-bottom:12px;background:linear-gradient(135deg,rgba(74,168,255,.18),rgba(124,92,255,.14));border:1px solid rgba(255,255,255,.8);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- Tables page ---------- */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tbl{padding:16px;text-align:left;min-height:130px;display:flex;flex-direction:column;gap:6px;transition:transform .18s}
.tbl:hover{transform:translateY(-3px)}
.tbl .tn{font-family:Outfit;font-size:24px;font-weight:800}
.tbl .st{position:absolute;top:14px;right:14px}
.tbl.running{background:linear-gradient(150deg,rgba(255,226,230,.85),rgba(255,255,255,.35))}
.tbl.reserved{background:linear-gradient(150deg,rgba(220,234,255,.85),rgba(255,255,255,.35))}

/* ---------- Kitchen ---------- */
.kds{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start;min-width:980px}
.kcol{padding:12px;min-height:60vh}
.kcol h3{display:flex;align-items:center;justify-content:space-between;font-size:15px;padding:4px 6px 12px}
.ticket{padding:13px;margin-bottom:10px;border-radius:16px;background:rgba(255,255,255,.72);border:1px solid var(--edge);box-shadow:0 4px 14px rgba(46,56,120,.08);animation:lineIn .35s}
.ticket.late{border-color:rgba(225,29,72,.5);box-shadow:0 0 0 3px rgba(225,29,72,.12)}
.ticket ul{list-style:none;margin:8px 0 10px}
.ticket li{padding:4px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ticket li:last-child{border:0}
.ticket li .nt{display:block;color:var(--warn);font-size:11.5px}

/* ---------- Menu manager ---------- */
.menu-grp{margin-bottom:18px}
.menu-grp h3{display:flex;align-items:center;gap:10px;font-size:15px;margin:4px 4px 10px}
.mi{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.55);border:1px solid var(--edge);margin-bottom:8px}
.mi .em{font-size:22px;width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.85);flex:none}
.mi .nm{flex:1;min-width:0}
.mi .nm b{display:flex;align-items:center;gap:7px}
.switch{position:relative;width:40px;height:23px;border-radius:999px;background:rgba(120,130,180,.3);transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--good)}.switch.on::after{transform:translateX(17px)}

/* ---------- Modal / toast / auth ---------- */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(30,36,70,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modalbox{width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:24px;background:linear-gradient(150deg,rgba(255,255,255,.88),rgba(255,255,255,.66));animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
.modalbox.wide{width:min(820px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.modalbox h2{font-size:21px;font-weight:800;margin-bottom:4px}
.modalbox .x{position:absolute;top:16px;right:16px}
.modalbox .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.pay-methods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pm{padding:12px 6px;border-radius:14px;background:rgba(255,255,255,.65);border:1px solid var(--edge);display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:650;font-size:12px;transition:all .2s}
.pm i{font-size:18px;color:var(--ink-2)}
.pm.on{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(240,40,63,.3)}
.pm.on i{color:#fff}
.bigtotal{font-family:Outfit;font-size:38px;font-weight:800;letter-spacing:-.02em}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;z-index:80;padding:12px 18px;border-radius:14px;font-weight:600;transition:all .3s cubic-bezier(.2,.9,.3,1.2);pointer-events:none;display:flex;gap:10px;align-items:center;background:rgba(23,27,54,.88);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 12px 30px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.auth{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px}
.auth-box{width:min(420px,100%);padding:34px 30px;text-align:center}
.auth-box .logo{width:150px;height:150px;margin:0 auto 16px;box-shadow:0 16px 40px rgba(240,40,63,.35),0 0 0 4px rgba(255,255,255,.9)}
.auth-box h1{font-size:30px;font-weight:800}
.auth-box form{display:grid;gap:12px;margin-top:22px;text-align:left}
.auth-err{color:var(--bad);font-size:12.5px;display:none}
#spark{position:fixed;inset:0;pointer-events:none;z-index:90}
/* DUORISE "Powered by" credit */
.duo{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:16px;background:linear-gradient(135deg,#0a0f1e,#16213f);color:#fff;box-shadow:0 6px 18px rgba(20,40,120,.28),inset 0 1px 0 rgba(255,255,255,.12);text-decoration:none}
.duo img{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px rgba(80,160,255,.8),0 0 12px rgba(60,140,255,.55)}
.duo small{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#8fb6ff;font-weight:600}
.duo b{display:block;font-family:Outfit;font-size:14px;font-weight:800;letter-spacing:.16em;background:linear-gradient(90deg,#fff,#7fb8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sidebar .duo{margin:10px 2px 0}
.auth-box .duo{justify-content:center;margin:22px auto 0;width:max-content}

/* ---------- Responsive ---------- */
@media (max-width:1280px){.kpis{grid-template-columns:repeat(2,1fr)}.pos{grid-template-columns:1fr 340px}}
@media (max-width:1024px){
  .app{grid-template-columns:1fr;padding:10px;gap:10px}

@media print{body{overflow:visible}}
/* ================= PERFORMANCE (smooth on low-end PCs / tablets) =================
   - background blobs no longer animate or blend (they forced a full repaint every frame)

.modal{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(30,36,70,.35)}

/* Day Menu / After Hours switch */
.menuset{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 2px}
.ms-btn{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;border:2px solid transparent;background:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(46,56,120,.08);text-align:left;transition:border-color .2s,background .2s,transform .15s}

<script>
/* =============================================================================
   CONFIG
============================================================================= */
const CONFIG = {
  // 'local'  = MEMORY ONLY: nothing is written to localStorage / sessionStorage / cookies.
  //            All data lives in this open tab and is cleared on refresh or close.
  // 'remote' = REST backend (see API section).
  // FIREBASE: when you connect Firebase, replace the 6 memory methods marked
  //           "FIREBASE:" in the API object below (list / create / update / remove /
  //           getDoc / setDoc) with Firestore calls — the rest of the app needs no change.
  DATA_MODE: 'firebase',       // 'firebase' = Firestore + Firebase Auth | 'local' = memory only | 'remote' = REST
  API_BASE: '/api',            // used when DATA_MODE === 'remote'
  PRICE_EDIT_NEEDS_PIN: true,  // true = editing a price at billing asks for the Owner PIN (remembered for 10 min). false = anyone can edit.
  POLL_MS: 5000,               // remote refresh interval for orders / KOTs / tables
  // LOCAL MODE login account. BACKEND: remove this and verify credentials on the
  // server (POST /api/auth/login) — never ship real passwords inside front-end code.
  FIREBASE: {
    apiKey: "AIzaSyCRbZgPkWtyn0byd6v0QR5myCDEkCKjhbk",
    authDomain: "chilli-bistro.firebaseapp.com",
    projectId: "chilli-bistro",
    storageBucket: "chilli-bistro.firebasestorage.app",
    messagingSenderId: "659556227685",
    appId: "1:659556227685:web:b07549811dee265bffc48c",
    measurementId: "G-814R9W9NHS"
  },
  LOCAL_LOGIN: { emails: ['1234@gmail.com'], password: '1234cb', name: 'Chilli Bistro', role: 'ADMIN' }
};
const COLLECTIONS = ['menu','orders','kots','tables','customers','expenses','staff','held'];

const DEFAULT_SETTINGS = {
  businessName: 'CHILLI BISTRO',
  tagline: 'Fire • Flavour • Fusion',
  address: '',
  phone: '',
  gstin: '',
  fssai: '',
  currency: '₹',
  tax: 5,                 // total GST % (= CGST + SGST, kept in sync automatically)
  cgst: 2.5,              // Central GST %
  sgst: 2.5,              // State GST %
  service: 10,            // service tax %  (switched ON/OFF per bill in POS)
  serviceOn: false,       // OFF by default — cashier turns it ON per bill in POS/Billing
  serviceScope: 'dine',   // 'dine' = dine-in only | 'all' = every order type
  serviceLabel: 'Service Tax',
  ownerWhatsApp: '7018100687', // owner's WhatsApp (070181 00687 → +91 70181 00687) — bills/orders are sent here
  waOnPay: true,          // "Send bill to owner on WhatsApp" is ticked by default on the payment screen
  discount: 0,            // default discount %
  roundOff: true,
  receipt: 80,            // receipt paper width in mm (58 / 80)
  kotWidth: 80,
  billPrefix: 'CB',
  kotPrefix: 'K',
  footer: 'Thank you for dining with us! Visit again 🌶️',
  ownerPin: '1234',       // LOCAL MODE ONLY — remote mode verifies on the server
  autoKotOnPay: true,
  printOnPay: true,
  printLogo: true,
  priceEditPin: false,    // true = changing an item price in the POS cart asks for the Owner PIN
  sparks: true,
  motion: true,
  expenseCats: ['Raw Material','Vegetables','Dairy','Meat & Seafood','Gas / Fuel','Salary','Rent','Electricity','Water','Internet','Packaging','Maintenance','Marketing','Transport','Other']
};

/* =============================================================================
   DATA LAYER  —  replace / extend for your backend
============================================================================= */
const API = {
  token: null,
  _db: null,
  get remote(){ return CONFIG.DATA_MODE === 'remote'; },
  get fb(){ return CONFIG.DATA_MODE === 'firebase'; },
  /* ---------- FIREBASE ---------- */
  _fbApp: null, _unsubs: [],
  fbInit(){
    if(this._fbApp) return;
    this._fbApp = firebase.initializeApp(CONFIG.FIREBASE);
    this.db = firebase.firestore();
    this.db.settings({ ignoreUndefinedProperties: true });
    // Offline cache: the POS keeps working if the internet drops and syncs when it returns
    this.db.enablePersistence({ synchronizeTabs: true }).catch(e => console.warn('Offline cache unavailable:', e.code));
    this.fbAuth = firebase.auth();
    try{ if(location.protocol.startsWith('http')) firebase.analytics(); }catch(e){}
  },
  _clean(o){ return JSON.parse(JSON.stringify(o)); },   // drops undefined, plain data only
  _bg(p){ p.catch(e => { console.error(e); toast('Not saved to cloud: ' + (e.code || e.message), 'bad'); }); },  // never block the till on the network
  // Live listeners: replace polling, keep every device in sync
  fbStart(){
    if(this._unsubs.length) return Promise.resolve();
    const waits = [];
    const watch = (ref, onData) => waits.push(new Promise(res => {
      let first = true;
      this._unsubs.push(ref.onSnapshot(snap => {
        onData(snap);
        if(first){ first = false; res(); } else if(!snap.metadata.hasPendingWrites) softRefresh();
      }, err => { console.error(err); setDataChip(false, err.code || err.message); if(first){ first = false; res(); } }));
    }));
    COLLECTIONS.forEach(c => watch(this.db.collection(c), snap => {
      state[c] = snap.docs.map(d => ({ ...d.data(), id: d.id })).sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
    }));
    watch(this.db.collection('docs').doc('settings'), snap => { if(snap.exists && !snap.metadata.hasPendingWrites) applySettings(snap.data()); });
    watch(this.db.collection('docs').doc('running'), snap => { if(snap.exists && !snap.metadata.hasPendingWrites && !_runDirty) state.carts = snap.data() || {}; });
    return Promise.all(waits);
  },
  fbStop(){ this._unsubs.forEach(u => u()); this._unsubs = []; },
  // In-memory database (no browser storage). FIREBASE: replace with Firestore.
  _load(){
    if(this._db) return this._db;
    const d = { docs: {} };
    COLLECTIONS.forEach(c => { d[c] = []; });
    this._db = d; return d;
  },
  _save(){ /* memory only — nothing is persisted. FIREBASE: writes go to Firestore instead. */ },
  async _req(method, path, body){
    const res = await fetch(CONFIG.API_BASE + path, {
      method,
      headers: { 'Content-Type':'application/json', ...(this.token ? { Authorization:'Bearer ' + this.token } : {}) },
      body: body !== undefined ? JSON.stringify(body) : undefined
    });
    if(!res.ok) throw new Error(`${method} ${path} → ${res.status}`);
    return res.status === 204 ? null : res.json();
  },
  async list(col){
    if(this.fb){ const snap = await this.db.collection(col).get(); return snap.docs.map(d => ({ ...d.data(), id: d.id })); }
    if(this.remote) return this._req('GET', '/' + col);
    return JSON.parse(JSON.stringify(this._load()[col]));
  },
  async create(col, data){   // FIREBASE: replace the memory branch below with Firestore
    const doc = { id: uid(), createdAt: new Date().toISOString(), ...data };
    if(this.fb){ const c = this._clean(doc); this._bg(this.db.collection(col).doc(c.id).set(c)); return c; }
    if(this.remote) return this._req('POST', '/' + col, doc);
    this._load()[col].push(doc); this._save(); return JSON.parse(JSON.stringify(doc));
  },
  async update(col, id, patch){
    if(this.fb){ const c = this._clean({ ...patch, updatedAt: new Date().toISOString() }); this._bg(this.db.collection(col).doc(id).set(c, { merge: true })); return c; }
    if(this.remote) return this._req('PATCH', `/${col}/${encodeURIComponent(id)}`, patch);
    const arr = this._load()[col]; const i = arr.findIndex(x => x.id === id);
    if(i < 0) throw new Error('Not found');
    arr[i] = { ...arr[i], ...patch, updatedAt: new Date().toISOString() }; this._save();
    return JSON.parse(JSON.stringify(arr[i]));
  },
  async remove(col, id){
    if(this.fb){ this._bg(this.db.collection(col).doc(id).delete()); return; }
    if(this.remote) return this._req('DELETE', `/${col}/${encodeURIComponent(id)}`);
    const d = this._load(); d[col] = d[col].filter(x => x.id !== id); this._save();
  },
  async replaceAll(col, docs){
    if(this.fb){
      const old = await this.list(col), ops = [...old.map(d => ['del', d.id]), ...docs.map(d => ['set', d.id, this._clean(d)])];
      for(let i = 0; i < ops.length; i += 400){
        const b = this.db.batch();
        ops.slice(i, i + 400).forEach(o => o[0] === 'del' ? b.delete(this.db.collection(col).doc(o[1])) : b.set(this.db.collection(col).doc(o[1]), o[2]));
        this._bg(b.commit());
      }
      return docs;
    }
    if(this.remote) return this._req('PUT', '/' + col, docs);
    this._load()[col] = docs; this._save(); return docs;
  },
  async getDoc(key){
    if(this.fb){ const d = await this.db.collection('docs').doc(key).get(); return d.exists ? d.data() : null; }
    if(this.remote){ try{ return await this._req('GET', '/docs/' + key); }catch(e){ return null; } }
    const v = this._load().docs[key]; return v ? JSON.parse(JSON.stringify(v)) : null;
  },
  async setDoc(key, value){
    if(this.fb){ this._bg(this.db.collection('docs').doc(key).set(this._clean(value))); return value; }
    if(this.remote) return this._req('PUT', '/docs/' + key, value);
    this._load().docs[key] = value; this._save(); return value;
  },
  async exportAll(){
    const out = { exportedAt: new Date().toISOString(), docs: {} };
    for(const c of COLLECTIONS) out[c] = await this.list(c);
    out.docs.settings = await this.getDoc('settings');
    out.docs.running = await this.getDoc('running');
    return out;

function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if(c === '"') q = true;
    else if(c === ','){ row.push(cur); cur = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && text[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if(cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ''));
}

}
function rangeFor(mode, from, to){
  const t = new Date(); const k = dateKey;
  if(mode === 'today') return { from:k(t), to:k(t) };
  if(mode === 'yesterday'){ const y = new Date(t); y.setDate(t.getDate() - 1); return { from:k(y), to:k(y) }; }
  if(mode === 'week'){ const s = new Date(t); s.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return { from:k(s), to:k(t) }; }
  if(mode === 'month') return { from:k(new Date(t.getFullYear(), t.getMonth(), 1)), to:k(t) };
  if(mode === 'lastmonth') return { from:k(new Date(t.getFullYear(), t.getMonth() - 1, 1)), to:k(new Date(t.getFullYear(), t.getMonth(), 0)) };
  if(mode === 'all') return { from:'0000-00-00', to:'9999-12-31' };
  return { from: from || k(t), to: to || k(t) };
}

function countUp(el, animate){
  const to = Number(el.dataset.count) || 0, isMoney = el.dataset.money === '1';
  const fmt = v => isMoney ? money(Math.round(v)) : Math.round(v).toLocaleString('en-IN');
  if(!animate || !state.settings.motion){ el.textContent = isMoney ? money(to) : to.toLocaleString('en-IN'); return; }
  const t0 = performance.now(), d = 1100;
  const step = t => { const p = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - p, 4); el.textContent = p < 1 ? fmt(to * e) : (isMoney ? money(to) : to.toLocaleString('en-IN')); if(p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

}

function cartKey(){
  if(state.addTo) return 'ADD:' + state.addTo;

/* Line amount — complimentary lines are free (₹0) but keep their real price for reference. */
const lineAmt = l => l.comp ? 0 : (Number(l.price) || 0) * (Number(l.qty) || 0);
/* Does service charge apply to this order type at all? */
function serviceApplies(type){ const s = state.settings; return (Number(s.service) || 0) > 0 && (s.serviceScope === 'all' || (type || state.orderType) === 'DINE-IN'); }
/* svcOn: true/false per bill; undefined = use the default from Tax settings */
function totals(items, disc, type, svcOn){
  const s = state.settings;
  const cgstR = Number(s.cgst) || 0, sgstR = Number(s.sgst) || 0;
  const subtotal = r2(sum(items, lineAmt));
  const compValue = r2(sum(items, l => l.comp ? (Number(l.price) || 0) * (Number(l.qty) || 0) : 0));
  let discount = disc ? (disc.mode === 'flat' ? Math.min(subtotal, Number(disc.value) || 0) : subtotal * (Number(disc.value) || 0) / 100) : subtotal * (Number(s.discount) || 0) / 100;
  discount = r2(discount);
  const taxable = r2(subtotal - discount);
  // default comes from Tax & Billing; the POS switch (svcOn) overrides it for this bill, for any order type
  const svc = (Number(s.service) || 0) > 0 && (svcOn === undefined ? (s.serviceOn !== false && serviceApplies(type)) : !!svcOn);
  const serviceRate = svc ? (Number(s.service) || 0) : 0;
  const service = r2(taxable * serviceRate / 100);
  const cgst = r2((taxable + service) * cgstR / 100);
  const sgst = r2((taxable + service) * sgstR / 100);
  const tax = r2(cgst + sgst);
  const raw = r2(taxable + service + tax);
  const total = s.roundOff ? Math.round(raw) : raw;
  return { subtotal, compValue, discount, taxable, service, serviceRate, serviceOn: svc, cgst, sgst, cgstRate: cgstR, sgstRate: sgstR, tax, roundOff: r2(total - raw), total, discLabel: disc ? (disc.mode === 'flat' ? 'Flat' : disc.value + '%') : (Number(s.discount) ? s.discount + '%' : '') };

/* ---------- Sizes / portions in one card ----------
   Dishes in the same category whose names differ only by a size in brackets or after a dash
   are shown as ONE card with a button per size, e.g.
     "Kingfisher (Small)", "Kingfisher (Medium)", "Kingfisher (Large)"   or   "Chilli Chicken (Half)", "Chilli Chicken (Full)".
   A dish with the plain base name ("Veg Burger" next to "Veg Burger (With Cheese)") becomes the "Regular" button. */
const VARIANT_ORDER = ['regular','reg','r','small','s','mini','quarter','qtr','half','solo','solo-plus','single','medium','med','m','large','l','full','the crew','crew','double','jumbo','family','xl'];
function variantSplit(name){
  let n = String(name || '').trim(), tag = '';
  const ah = n.match(/\s*\(AH\)\s*$/i); if(ah){ tag = ' (AH)'; n = n.slice(0, ah.index).trim(); }
  const m = n.match(/^(.*\S)\s*\(([^()]+)\)\s*$/) || n.match(/^(.*\S)\s+[-–—]\s+(\S.*)$/);
  return m ? { base: m[1].trim() + tag, label: m[2].trim() } : { base: n + tag, label: '' };
}
function groupVariants(list){
  const out = [], byKey = new Map();
  list.forEach((m, i) => {
    const sp = variantSplit(m.name), key = (m.cat || 'Other').trim() + '|' + sp.base.toLowerCase();
    let g = byKey.get(key);
    if(!g){ g = { base: sp.base, members: [] }; byKey.set(key, g); out.push(g); }
    g.members.push({ item: m, label: sp.label, i });
  });
  return out.flatMap(g => {
    if(g.members.length < 2) return g.members.map(v => ({ item: v.item }));
    const rank = v => { const r = VARIANT_ORDER.indexOf((v.label || 'regular').toLowerCase()); return r < 0 ? 100 + v.i : r; };
    const variants = g.members.map(v => ({ ...v, label: v.label || 'Regular' })).sort((a, b) => rank(a) - rank(b) || a.i - b.i);
    return [{ base: g.base, variants }];
  });
}

  t.discLabel = o.discLabel;

    cgst: isComp ? 0 : t.cgst, sgst: isComp ? 0 : t.sgst, cgstRate: t.cgstRate, sgstRate: t.sgstRate, serviceRate: t.serviceRate, serviceOn: t.serviceOn, compItems: t.compValue, kotIds: [...(o.kotIds || []), ...(k ? [k.id] : [])], amended: true };
  const diff = r2(patch.total - o.total);
  if(o.payment === 'Split' && o.split) patch.split = { ...o.split, Cash: r2((o.split.Cash || 0) + diff) };
  const updated = await safe(() => dbUpdate('orders', o.id, patch));
  if(!updated) return;
  if(k) await safe(() => dbUpdate('kots', k.id, { bill: o.code }));
  if(o.customerMobile){ const cu = state.customers.find(x => x.mobile === o.customerMobile); if(cu) await safe(() => dbUpdate('customers', cu.id, { spent: r2((cu.spent || 0) + diff) })); }
  delete state.carts[cartKey()]; state.addTo = null; saveRunning();
  toast(`Bill #${o.code} updated • +${money(diff)} to collect`);
  if(k) printKOT(k);
  state.page = 'orders'; render();
}

/* ---------- Printing ---------- */
function printHtml(html){
  const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;left:-9999px;top:0;width:80mm;height:1200px;border:0';
  document.body.appendChild(f); const d = f.contentWindow.document; d.open(); d.write(html); d.close();
  setTimeout(() => { try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ toast('Print failed', 'bad'); } setTimeout(() => f.remove(), 2000); }, 300);
}
/* Thermal printers can't print to the paper edge: 80 mm paper ≈ 72 mm printable, 58 mm ≈ 48 mm.
   Sizing the page to the printable width stops the Amount column from being cut off. */
function printCss(w){
  const pw = w < 70 ? 46 : 70;   // printable width, a little inside the safe area so nothing touches the edge
  return `@page{size:${w}mm auto;margin:0}*{box-sizing:border-box}
  html,body{margin:0;padding:0;height:auto}
  body{width:${pw}mm;margin:0 auto;padding:3mm 0 10mm;font-family:'Courier New',Courier,monospace;font-size:${w < 70 ? 9.5 : 11}px;color:#000;line-height:1.3;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr,.hr,.hr2{page-break-inside:avoid;break-inside:avoid}
  img{max-width:100%;display:block;margin:0 auto}
  .c{text-align:center}.r{text-align:right;white-space:nowrap}.b{font-weight:700}.lg{font-size:1.45em}
  .hr{border-top:1px dashed #000;margin:4px 0}.hr2{border-top:2px solid #000;margin:4px 0}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  td,th{padding:1.5px 0;vertical-align:top}
  th{font-weight:700;border-bottom:1px dashed #000;padding-bottom:3px;text-align:left}
  th.r{text-align:right}
  .items td.nm{word-break:normal;overflow-wrap:break-word;hyphens:none;padding-right:4px}
  .items td.q,.items th.q{text-align:center;white-space:nowrap}
  .items small{font-size:.85em}
  .sum td:first-child{padding-right:4px}
  .tot td{font-weight:700;font-size:1.3em;padding-top:4px}
  .meta td{font-size:.95em}`;
}

/* ---------- WhatsApp: send a bill / order to the owner (or the guest) ---------- */
// Indian numbers: "070181 00687" / "7018100687" / "+91 70181 00687" / "0091…" → 917018100687
function waNumber(n){
  let d = digits(n);
  if(d.startsWith('00')) d = d.slice(2);                 // 0091… international prefix
  if(d.length === 11 && d.startsWith('0')) d = d.slice(1); // 0 + 10-digit mobile (trunk prefix)
  if(d.length === 10) d = '91' + d;
  return d;
}
function waLink(num, text){ return `https://wa.me/${waNumber(num)}?text=${encodeURIComponent(text)}`; }
function billText(o){
  const s = state.settings, cur$ = s.currency || '₹', when = o.createdAt ? new Date(o.createdAt) : new Date();
  const cgst = o.cgst != null ? o.cgst : r2((o.tax || 0) / 2), sgst = o.sgst != null ? o.sgst : r2((o.tax || 0) - cgst);
  const cgstR = o.cgstRate != null ? o.cgstRate : (Number(s.tax) || 0) / 2, sgstR = o.sgstRate != null ? o.sgstRate : (Number(s.tax) || 0) / 2;
  const m = v => cur$ + r2(v).toFixed(2);
  const L = [];
  L.push(`*${s.businessName || 'CHILLI BISTRO'}* 🌶️`);
  L.push(`${o.status === 'Void' ? '❌ VOID ' : ''}${o.payment === 'Comp' ? '🎁 COMPLIMENTARY BILL' : '🧾 Bill'} *#${o.code || 'DRAFT'}*`);
  L.push(`📅 ${when.toLocaleDateString('en-IN')} ${when.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' })}`);
  L.push(`🍽️ ${o.type || ''}${o.table ? ' • ' + o.table : ''}${o.cashier ? ' • by ' + o.cashier : ''}`);
  if(o.customerName || o.customerMobile) L.push(`👤 ${o.customerName || ''} ${o.customerMobile ? '(' + o.customerMobile + ')' : ''}`.trim());
  L.push('──────────────');
  (o.items || []).forEach(i => L.push(`${i.qty} × ${i.name} @${r2(i.price)} = ${i.comp ? '*FREE* 🎁' : m(i.price * i.qty)}${i.note ? `\n   _${i.note}_` : ''}`));
  L.push('──────────────');
  L.push(`Subtotal: ${m(o.subtotal)}`);
  const compItems = o.compItems || 0;
  if(compItems) L.push(`Complimentary items: ${m(compItems)} (free)`);
  if(o.discount) L.push(`Discount${o.discLabel ? ' (' + o.discLabel + ')' : ''}: −${m(o.discount)}`);
  if(o.service) L.push(`${s.serviceLabel || 'Service Charge'}${o.serviceRate != null ? ' @' + o.serviceRate + '%' : ''}: ${m(o.service)}`);
  if(cgst) L.push(`CGST @${cgstR}%: ${m(cgst)}`);
  if(sgst) L.push(`SGST @${sgstR}%: ${m(sgst)}`);
  if(o.roundOff) L.push(`Round off: ${o.roundOff > 0 ? '+' : ''}${r2(o.roundOff).toFixed(2)}`);
  L.push(`*TOTAL: ${m(o.total)}*`);
  if(o.payment === 'Comp') L.push(`Bill value: ${m(o.compValue)}${o.compReason ? ' — ' + o.compReason : ''}`);
  if(o.payment) L.push(`💳 Paid by: ${o.payment}${o.split ? ' (' + Object.entries(o.split).filter(([, v]) => v).map(([k, v]) => k + ' ' + v).join(', ') + ')' : ''}`);
  return L.join('\n');
}
function sendBillWA(id, toGuest){
  const o = state.orders.find(x => x.id === id); if(!o) return;
  const num = toGuest ? o.customerMobile : state.settings.ownerWhatsApp;
  if(!digits(num)) return toast(toGuest ? 'No customer mobile on this bill' : "Add the owner's WhatsApp number in Tax & Billing first", 'warn');
  window.open(waLink(num, billText(o)), '_blank');
}

function sendCartWA(){

function parseMenuText(text){
  text = text.trim(); if(!text) return [];
  if(text[0] === '[' || text[0] === '{'){
    let j = JSON.parse(text); if(!Array.isArray(j)) j = j.menu || j.items || [];
    return j.map(x => ({ name: x.name, cat: x.cat || x.category, price: x.price, type: x.type || (x.veg === false ? 'nonveg' : 'veg'), cost: x.cost, emoji: x.emoji, station: x.station }));
  }
  const rows = parseCSV(text); if(!rows.length) return [];
  let head = ['name','category','price','type','cost','emoji','station'];
  if(rows[0].some(c => /name|price|categ/i.test(c))) head = rows.shift().map(h => h.trim().toLowerCase());
  const idx = k => head.findIndex(h => h.startsWith(k));
  return rows.map(r => ({ name: r[idx('name')], cat: r[idx('cat')], price: r[idx('price')], type: r[idx('type')] ?? r[idx('veg')], cost: r[idx('cost')], emoji: r[idx('emoji')], station: r[idx('station')] }));
}
function normType(t){ t = String(t || '').toLowerCase().replace(/[^a-z]/g, ''); return t.startsWith('non') || t === 'nv' || t === 'n' ? 'nonveg' : t.startsWith('egg') ? 'egg' : 'veg'; }
async function doImportMenu(){
  let list;
  try{ list = parseMenuText($('#impText').value); }catch(e){ return toast('Could not read: ' + e.message, 'bad'); }

  if(!list.length) return toast('No valid rows found (need at least Name and Price)', 'warn');
  const replace = $('#impReplace').checked;
  await safe(async () => {
    if(replace){ const docs = list.map(x => ({ id: uid(), createdAt: new Date().toISOString(), ...x })); await API.replaceAll('menu', docs); state.menu = API.remote ? await API.list('menu') : docs; }
    else for(const x of list){ const ex = state.menu.find(m => m.name.toLowerCase() === x.name.toLowerCase()); if(ex) await dbUpdate('menu', ex.id, x); else await dbCreate('menu', x); }
    state.settings.categoryOrder = [...new Set(list.map(x => x.cat))]; await API.setDoc('settings', state.settings);
  }, `${list.length} dishes imported`);
  closeModal(); render(true);
}

/* =============================================================================
   PROFIT & LOSS
============================================================================= */
function monthStats(ym){
  const os = liveOrders().filter(o => (o.dateKey || '').startsWith(ym));
  const rev = sum(os, 'total'), tax = sum(os, 'tax');
  const cogs = sum(os, o => sum(o.items || [], i => (Number(i.cost ?? state.menu.find(m => m.id === i.id)?.cost) || 0) * i.qty));
  const exp = sum(state.expenses.filter(e => (e.date || '').startsWith(ym) && e.category !== 'Salary'), 'amount');
  const salExp = sum(state.expenses.filter(e => (e.date || '').startsWith(ym) && e.category === 'Salary'), 'amount');
  const sal = salExp || sum(state.staff.filter(s => s.status !== 'Inactive'), 'salary');
  const netRev = rev - tax;
  return { rev, tax, netRev, cogs, gross: netRev - cogs, exp, sal, net: netRev - cogs - exp - sal, bills: os.length };
}
PAGES.pnl = () => {
  const ym = state.pnlMonth || dateKey().slice(0, 7); const m = monthStats(ym);
  const line = (k, v, strong, neg) => `<div class="sumrow" style="${strong ? 'font-weight:800;color:var(--ink);font-size:15px;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px' : ''}"><span>${k}</span><span style="${neg ? 'color:var(--bad)' : ''}">${neg ? '−' : ''}${money(Math.abs(v))}</span></div>`;
  return `<div class="glass card" style="margin-bottom:16px;padding:14px 18px"><div class="toolbar" style="margin:0"><label class="row small" style="font-weight:600">Month <input type="month" class="input" style="width:auto" value="${ym}" onchange="state.pnlMonth=this.value;render(true)"></label><span class="muted small">Salaries: “Salary” expenses for the month, or staff monthly salaries if none recorded.</span></div></div>
  <div class="kpis">${kpi('Revenue (incl. GST)', m.rev, `${m.bills} bills`, 'fa-indian-rupee-sign', 'c1', true)}${kpi('Gross profit', m.gross, `after food cost ${money(m.cogs)}`, 'fa-arrow-trend-up', 'c3', true)}${kpi('Expenses + salaries', m.exp + m.sal, `salaries ${money(m.sal)}`, 'fa-wallet', 'c4', true)}${kpi('Net profit', m.net, `${m.netRev ? (m.net / m.netRev * 100).toFixed(1) : 0}% margin`, 'fa-scale-balanced', m.net >= 0 ? 'c2' : 'c1', true)}</div>
  <div class="grid g-2-1"><div class="glass spot card"><div class="card-h"><h3>Last 6 months</h3></div><div class="chart-box" style="height:300px"><canvas id="pnlChart"></canvas></div></div>
  <div class="glass card"><div class="card-h"><h3>Statement</h3><span class="sub">${new Date(ym + '-01T00:00').toLocaleDateString('en-IN', { month:'long', year:'numeric' })}</span></div>
    ${line('Gross revenue', m.rev)}${line('GST collected', m.tax, false, true)}${line('Net revenue', m.netRev, true)}${line('Food cost (COGS)', m.cogs, false, true)}${line('Gross profit', m.gross, true)}${line('Operating expenses', m.exp, false, true)}${line('Staff salaries', m.sal, false, true)}
    <div class="sumrow total"><span>Net ${m.net >= 0 ? 'profit' : 'loss'}</span><span style="color:${m.net >= 0 ? 'var(--good)' : 'var(--bad)'}">${money(m.net)}</span></div>
    <p class="small muted" style="margin-top:10px">Food cost uses each dish's cost price from the Menu.</p></div></div>`;
};
function drawPnlChart(){
  if(!chartDefaults()) return; const c = $('#pnlChart'); if(!c) return;
  const base = new Date((state.pnlMonth || dateKey().slice(0, 7)) + '-01T00:00'); const ms = [];
  for(let i = 5; i >= 0; i--){ const d = new Date(base.getFullYear(), base.getMonth() - i, 1); ms.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`); }
  const st = ms.map(monthStats);

function restore(file){

/* =============================================================================
   EFFECTS — SpotlightCard pointer tracking + ClickSpark (React Bits inspired)
============================================================================= */
document.addEventListener('pointermove', e => {
  const el = e.target.closest && e.target.closest('.spot'); if(!el) return;
  const r = el.getBoundingClientRect(); el.style.setProperty('--mx', (e.clientX - r.left) + 'px'); el.style.setProperty('--my', (e.clientY - r.top) + 'px');
}, { passive: true });
(function clickSpark(){
  const cv = $('#spark'), ctx = cv.getContext('2d'); let sparks = [], raf = 0;
  const size = () => { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); };
  addEventListener('resize', size); size();
  const loop = t => {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    sparks = sparks.filter(s => { const p = (t - s.t) / 420; if(p >= 1) return false; const e = 1 - Math.pow(1 - p, 3), d = e * 22, len = 9 * (1 - e);
      ctx.strokeStyle = `rgba(240,40,63,${1 - p})`; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath();
      ctx.moveTo(s.x + d * Math.cos(s.a), s.y + d * Math.sin(s.a)); ctx.lineTo(s.x + (d + len) * Math.cos(s.a), s.y + (d + len) * Math.sin(s.a)); ctx.stroke(); return true; });
    raf = sparks.length ? requestAnimationFrame(loop) : 0;
  };
  document.addEventListener('pointerdown', e => {
    if(!state.settings.sparks || !state.settings.motion || !e.target.closest('button,.btn,.prod,.tbl')) return;
    const t = performance.now(); for(let i = 0; i < 8; i++) sparks.push({ x: e.clientX, y: e.clientY, a: (Math.PI * 2 * i) / 8, t });
    if(!raf) raf = requestAnimationFrame(loop);
  });
})();

/* =============================================================================
   KEYBOARD SHORTCUTS
============================================================================= */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && modalOpen()){ closeModal(); return; }
  if(!state.user || modalOpen()) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
  if(state.page === 'pos'){
    if(e.key === '/' && !typing){ e.preventDefault(); $('#posSearch')?.focus(); }
    else if(e.key === 'F8'){ e.preventDefault(); state.addTo ? submitAddTo() : sendKOT(); }
    else if(e.key === 'F9'){ e.preventDefault(); if(!state.addTo) payBill(); }
    else if(e.key === 'Enter' && document.activeElement?.id === 'posSearch'){ const first = $('#posProducts .prod:not(.pgroup), #posProducts .pv'); if(first){ first.click(); e.target.select(); } }
  }
});
